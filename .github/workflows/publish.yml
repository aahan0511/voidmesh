name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish release distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/voidmesh/
    steps:
      - name: Download distributions from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'voidmesh-*' --dir dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
