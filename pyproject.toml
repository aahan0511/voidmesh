[project]
name = "voidmesh"
version = "1.1.0"
description = "Live force-directed graphs and systematic trees for Python"
readme = "README.md"
authors = [
    { name = "Aahan", email = "188063520+aahan0511@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["graph", "visualization", "nodes", "physics", "canvas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.urls]
Documentation = "https://aahan0511.github.io/voidmesh/"
Issues = "https://github.com/aahan0511/voidmesh/issues"
Repository = "https://github.com/aahan0511/voidmesh"

[project.scripts]
voidmesh-demo = "voidmesh.demo:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py312"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
