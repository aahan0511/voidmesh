site_name: Voidmesh
site_description: Live force-directed graphs and systematic trees for Python
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Live graphs: guides/live-graphs.md
      - Force physics: guides/physics.md
      - Tree layout: guides/tree-layout.md
      - Styling: guides/styling.md
  - Examples: examples.md
  - API reference: reference/api.md
  - Troubleshooting: troubleshooting.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
strict: true
